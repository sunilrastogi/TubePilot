name: CI

on: [push, pull_request]

jobs:
  pylint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pylint
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')

  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Set up (macOS / Linux)
      if: runner.os != 'Windows'
      run: bash setup.command --auto
    - name: Set up (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: setup.bat /auto
    - name: Start the app and check it answers
      shell: bash
      run: |
        VPY=.venv/bin/python; [ -x "$VPY" ] || VPY=.venv/Scripts/python; [ -x "$VPY" ] || VPY=python
        PORT=8791 "$VPY" server.py &
        for i in $(seq 1 30); do curl -fs http://127.0.0.1:8791/api/config > /dev/null && break; sleep 1; done
        curl -fs http://127.0.0.1:8791/api/config | grep '"activeChannel"'
        curl -fs -o /dev/null http://127.0.0.1:8791/favicon.ico
        curl -fs -o /dev/null http://127.0.0.1:8791/
        ls data/channels/*/edits/sample_video
    - name: HTTPS certificates work (needs certifi on macOS python.org builds)
      shell: bash
      run: |
        VPY=.venv/bin/python; [ -x "$VPY" ] || VPY=.venv/Scripts/python; [ -x "$VPY" ] || VPY=python
        "$VPY" -c "import server, urllib.request; print(urllib.request.urlopen('https://www.googleapis.com/discovery/v1/apis?name=youtube&preferred=true', timeout=20).status)"
